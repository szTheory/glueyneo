name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to recover (must match the root version manifest)
        required: false
        type: string
      reuse_build_run:
        description: Reuse qualified immutable build artifacts from this release workflow run
        required: false
        type: string
      publish:
        description: Publish the verified draft after all staging and downloaded-consumer checks pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: glueyneo-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      should_build: ${{ steps.identity.outputs.should_build }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      workflow_commit: ${{ steps.identity.outputs.workflow_commit }}
      build_run_id: ${{ steps.build-origin.outputs.build_run_id }}
      reuse_builds: ${{ steps.build-origin.outputs.reuse_builds }}
      prior_manifest_artifact_name: ${{ steps.build-origin.outputs.prior_manifest_artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Verify effective App token repository scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 tools/workflow/app_scope.py --output build/app-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-app-authority-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: build/app-authority.json
          if-no-files-found: error
          retention-days: 7
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: identity
        name: Resolve versioned commit and always inspect its existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          tag="v${version}"
          mkdir -p build/release-control
          GH_API_URL="$GITHUB_API_URL" python3 tools/release_state.py query-api \
            --repository "$GITHUB_REPOSITORY" --tag "$tag" \
            --output build/release-control/release.json
          python3 tools/workflow/release_identity.py build/release-control/release.json
      - id: build-origin
        name: Select current builds or a verified recovery origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_BUILD_RUN: ${{ inputs.reuse_build_run }}
          SHOULD_BUILD: ${{ steps.identity.outputs.should_build }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REUSE_BUILD_RUN:-}" ]]; then
            [[ "$SHOULD_BUILD" == "true" ]] || { echo 'Build reuse requires an existing draft' >&2; exit 1; }
            python3 tools/workflow/release_build_reuse.py --run-id "$REUSE_BUILD_RUN" --version "$RELEASE_VERSION"
          else
            {
              echo "build_run_id=$GITHUB_RUN_ID"
              echo 'reuse_builds=false'
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-api-snapshot-attempt-${{ github.run_attempt }}
          path: build/release-control/release.json
          if-no-files-found: ignore
          retention-days: 7

  build-release:
    needs: release-control
    if: needs.release-control.outputs.should_build == 'true' && needs.release-control.outputs.reuse_builds != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            lane: linux-clang
            cc: clang
            cxx: clang++
          - name: macos-arm64
            runner: macos-15
            lane: macos-appleclang
            cc: ""
            cxx: ""
          - name: windows-x86_64
            runner: windows-2025
            lane: windows-msvc
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-control.outputs.commit }}
          persist-credentials: false
      - name: Run exact-commit SDK matrix and installed consumers
        if: runner.os != 'Windows'
        env:
          SDK_MATRIX_LANE: ${{ matrix.lane }}
          SDK_SOURCE_REVISION: ${{ needs.release-control.outputs.commit }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: python3 tools/verify_sdk.py --suite matrix --lane "$SDK_MATRIX_LANE" --output "build/matrix-evidence/$SDK_MATRIX_LANE.json"
      - name: Run exact-commit Windows SDK matrix and installed consumers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_MATRIX_LANE: ${{ matrix.lane }}
          SDK_SOURCE_REVISION: ${{ needs.release-control.outputs.commit }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -property installationPath
          if (-not $install) { throw 'Visual Studio with MSVC was not found' }
          $command = 'call "' + $install + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && python tools/verify_sdk.py --suite matrix --lane ' + $env:SDK_MATRIX_LANE + ' --output build/matrix-evidence/' + $env:SDK_MATRIX_LANE + '.json'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded matrix verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-matrix-diagnostics-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: build/matrix-evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Check out trusted release packaging helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: build/release-tools
          sparse-checkout: tools/release_manifest.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build offline source and complete installed SDK archives
        if: runner.os != 'Windows'
        run: python3 build/release-tools/tools/release_manifest.py build --repo . --commit "${{ needs.release-control.outputs.commit }}" --output-dir build/release-assets
      - name: Build offline source and complete installed SDK archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -property installationPath
          if (-not $install) { throw 'Visual Studio with MSVC was not found' }
          $command = 'call "' + $install + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && python build/release-tools/tools/release_manifest.py build --repo . --commit "${{ needs.release-control.outputs.commit }}" --output-dir build/release-assets'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-matrix-${{ matrix.name }}
          path: build/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  stage-release:
    outputs:
      manifest_artifact_name: ${{ steps.assemble.outputs.manifest_artifact_name }}
      downloaded_artifact_name: ${{ steps.downloaded.outputs.downloaded_artifact_name }}
    needs: [release-control, build-release]
    if: ${{ !cancelled() && needs.release-control.result == 'success' && needs.release-control.outputs.should_build == 'true' && (needs.build-release.result == 'success' || (needs.build-release.result == 'skipped' && needs.release-control.outputs.reuse_builds == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify effective App token repository scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 tools/workflow/app_scope.py --output build/app-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-app-authority-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: build/app-authority.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-matrix-*
          path: build/release-matrix
          run-id: ${{ needs.release-control.outputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Download the original trusted identity manifest for recovery
        if: needs.release-control.outputs.reuse_builds == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.release-control.outputs.prior_manifest_artifact_name }}
          path: build/prior
          run-id: ${{ needs.release-control.outputs.build_run_id }}
          github-token: ${{ github.token }}
      - id: assemble
        name: Assemble the exact archive set and identity manifest
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
          REUSING_BUILDS: ${{ needs.release-control.outputs.reuse_builds }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp "build/release-matrix/release-matrix-linux-x86_64/glueyneo-source-${RELEASE_VERSION}.tar.gz" build/release-assets/
          cp "build/release-matrix/release-matrix-linux-x86_64/glueyneo-sdk-${RELEASE_VERSION}-linux-x86_64.tar.gz" build/release-assets/
          cp "build/release-matrix/release-matrix-macos-arm64/glueyneo-sdk-${RELEASE_VERSION}-macos-arm64.tar.gz" build/release-assets/
          cp "build/release-matrix/release-matrix-windows-x86_64/glueyneo-sdk-${RELEASE_VERSION}-windows-x86_64.tar.gz" build/release-assets/
          python3 tools/release_manifest.py release-manifest --repo . --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --output-dir build/release-assets
          cp build/release-assets/release-manifest.json build/expected-release-manifest.json
          if [[ "$REUSING_BUILDS" == "true" ]]; then
            cmp -s build/prior/expected-release-manifest.json build/expected-release-manifest.json || { echo 'Reused archives differ from the original trusted source identity manifest' >&2; exit 1; }
          fi
          echo "manifest_artifact_name=release-identity-manifest-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.assemble.outputs.manifest_artifact_name }}
          path: build/expected-release-manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Re-query draft state and validate exact identity before upload
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
        run: |
          set -euo pipefail
          python3 tools/release_state.py query-api --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --output build/release-api.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"] == "found" and d["release"].get("draft") is True' build/release-api.json
          python3 tools/release_state.py validate-draft --release build/release-api.json --manifest build/release-assets/release-manifest.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" > build/release-validation.json
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release upload "$RELEASE_TAG" "build/release-assets/$asset"
          done < <(python3 -c 'import json; print("\n".join(json.load(open("build/release-validation.json"))["missing_assets"]))')
      - name: Re-query and require complete staged draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
        run: |
          set -euo pipefail
          python3 tools/release_state.py query-api --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --output build/release-api-final.json
          python3 tools/release_state.py validate-draft --release build/release-api-final.json --manifest build/expected-release-manifest.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" > build/release-validation-final.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"] == "ready" and d["publishable"]' build/release-validation-final.json
      - id: downloaded
        name: Download and hash staged bytes in the trusted staging job
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir build/release-download
          python3 tools/release_state.py verify-download --directory build/release-download --manifest build/expected-release-manifest.json
          echo "downloaded_artifact_name=release-downloaded-bytes-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.downloaded.outputs.downloaded_artifact_name }}
          path: build/release-download/*
          if-no-files-found: error
          retention-days: 3

  verify-downloaded-release:
    needs: [release-control, stage-release]
    if: ${{ !cancelled() && needs.release-control.result == 'success' && needs.release-control.outputs.should_build == 'true' && needs.stage-release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-control.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.stage-release.outputs.manifest_artifact_name }}
          path: build/expected
      - name: Receive hash-verified draft bytes without write authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.stage-release.outputs.downloaded_artifact_name }}
          path: build/release-download
      - name: Verify all downloaded release bytes against the trusted staged manifest
        run: python3 tools/release_state.py verify-download --directory build/release-download --manifest build/expected/expected-release-manifest.json > build/download-verification.json
        if: runner.os != 'Windows'
      - name: Verify all downloaded release bytes on Windows
        shell: pwsh
        run: python tools/release_state.py verify-download --directory build/release-download --manifest build/expected/expected-release-manifest.json > build/download-verification.json
        if: runner.os == 'Windows'
      - name: Rebuild downloaded source offline and execute this platform SDK consumers
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python3 tests/consumers/test_release_consumer.py --verify-downloaded --directory build/release-download --manifest build/expected/expected-release-manifest.json --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --platform "${{ matrix.name }}" --output build/delivery-evidence/consumer-result.json
        if: runner.os != 'Windows'
      - name: Rebuild downloaded source offline and execute Windows SDK consumers
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python tests/consumers/test_release_consumer.py --verify-downloaded --directory build/release-download --manifest build/expected/expected-release-manifest.json --commit $env:RELEASE_COMMIT --version $env:RELEASE_VERSION --platform windows-x86_64 --output build/delivery-evidence/consumer-result.json
        if: runner.os == 'Windows'
      - name: Bind downloaded example output to this platform job and source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_WORKFLOW_COMMIT: ${{ needs.release-control.outputs.workflow_commit }}
        run: python3 tests/consumers/test_delivery_contract.py --mode platform --distribution staged --directory build/release-download --manifest build/expected/expected-release-manifest.json --consumer-result build/delivery-evidence/consumer-result.json --platform "${{ matrix.name }}" --output build/delivery-evidence/platform.json
        if: runner.os != 'Windows'
      - name: Bind downloaded Windows example output to its platform job and source manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_WORKFLOW_COMMIT: ${{ needs.release-control.outputs.workflow_commit }}
        run: python tests/consumers/test_delivery_contract.py --mode platform --distribution staged --directory build/release-download --manifest build/expected/expected-release-manifest.json --consumer-result build/delivery-evidence/consumer-result.json --platform windows-x86_64 --output build/delivery-evidence/platform.json
        if: runner.os == 'Windows'
      - name: Scan history, downloaded bytes, notices, and rights on Linux
        if: matrix.name == 'linux-x86_64'
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/public_content.py --root . --history-revision "$RELEASE_COMMIT" \
            --log build/release-download/release-manifest.json \
            --log build/download-verification.json \
            --log build/delivery-evidence/consumer-result.json \
            --log build/delivery-evidence/platform.json \
            --log .github/workflows/release.yml \
            --log release-please-config.json \
            --archive "build/release-download/glueyneo-source-${RELEASE_VERSION}.tar.gz" \
            --archive "build/release-download/glueyneo-sdk-${RELEASE_VERSION}-linux-x86_64.tar.gz" \
            --archive "build/release-download/glueyneo-sdk-${RELEASE_VERSION}-macos-arm64.tar.gz" \
            --archive "build/release-download/glueyneo-sdk-${RELEASE_VERSION}-windows-x86_64.tar.gz" \
            --json build/public-content.json
      - name: Upload staged downloaded-example producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence-staged-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: |
            build/delivery-evidence/consumer-result.json
            build/delivery-evidence/platform.json
            build/download-verification.json
            build/expected/expected-release-manifest.json
            build/release-download/release-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload staged source/history scan evidence
        if: always() && matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence-public-content-attempt-${{ github.run_attempt }}
          path: build/public-content.json
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    needs: [release-control, stage-release, verify-downloaded-release]
    if: ${{ !cancelled() && needs.release-control.result == 'success' && needs.release-control.outputs.should_build == 'true' && needs.release-control.outputs.commit == needs.release-control.outputs.workflow_commit && needs.stage-release.result == 'success' && needs.verify-downloaded-release.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify effective App token repository scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 tools/workflow/app_scope.py --output build/app-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-app-authority-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: build/app-authority.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.stage-release.outputs.manifest_artifact_name }}
          path: build/expected
      - name: Re-query and revalidate the exact draft after all platform consumers pass
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
        run: |
          set -euo pipefail
          python3 tools/release_state.py query-api --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --output build/release-api.json
          python3 tools/release_state.py validate-draft --release build/release-api.json --manifest build/expected/expected-release-manifest.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" > build/release-validation.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"] == "ready" and d["publishable"]' build/release-validation.json
      - name: Publish the verified unsigned draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
        run: |
          set -euo pipefail
          release_id=$(python3 -c 'import json; print(json.load(open("build/release-api.json"))["release"]["id"])')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false > build/published-release.json
          python3 -c 'import json,os; d=json.load(open("build/published-release.json")); assert d["tag_name"] == os.environ["RELEASE_TAG"] and d["draft"] is False'
      - name: Preserve published identity and protected manifest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence-published-release-attempt-${{ github.run_attempt }}
          path: |
            build/published-release.json
            build/expected/expected-release-manifest.json
            build/app-authority.json
          if-no-files-found: warn
          retention-days: 7

  verify-published-release:
    needs: [release-control, stage-release, verify-downloaded-release, publish-release]
    if: ${{ !cancelled() && needs.release-control.result == 'success' && needs.release-control.outputs.should_build == 'true' && needs.stage-release.result == 'success' && needs.verify-downloaded-release.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-control.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.stage-release.outputs.manifest_artifact_name }}
          path: build/expected
      - name: Download the final public release bytes without credentials
        env:
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python3 tests/consumers/test_delivery_contract.py --mode public-download --directory build/release-download --manifest build/expected/expected-release-manifest.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
        if: runner.os != 'Windows'
      - name: Download the final public release bytes without credentials on Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-control.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python tests/consumers/test_delivery_contract.py --mode public-download --directory build/release-download --manifest build/expected/expected-release-manifest.json --tag $env:RELEASE_TAG --version $env:RELEASE_VERSION
        if: runner.os == 'Windows'
      - name: Rebuild anonymously downloaded source and execute this platform SDK consumers
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python3 tests/consumers/test_release_consumer.py --verify-downloaded --directory build/release-download --manifest build/expected/expected-release-manifest.json --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --platform "${{ matrix.name }}" --output build/delivery-evidence/consumer-result.json
        if: runner.os != 'Windows'
      - name: Rebuild anonymously downloaded Windows source and execute Windows SDK consumers
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.release-control.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-control.outputs.version }}
        run: python tests/consumers/test_release_consumer.py --verify-downloaded --directory build/release-download --manifest build/expected/expected-release-manifest.json --commit $env:RELEASE_COMMIT --version $env:RELEASE_VERSION --platform windows-x86_64 --output build/delivery-evidence/consumer-result.json
        if: runner.os == 'Windows'
      - name: Bind anonymous public bytes and example output to the platform job
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_WORKFLOW_COMMIT: ${{ needs.release-control.outputs.workflow_commit }}
        run: python3 tests/consumers/test_delivery_contract.py --mode platform --distribution published --directory build/release-download --manifest build/expected/expected-release-manifest.json --consumer-result build/delivery-evidence/consumer-result.json --platform "${{ matrix.name }}" --output build/delivery-evidence/platform.json
        if: runner.os != 'Windows'
      - name: Bind anonymous Windows bytes and example output to the platform job
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_WORKFLOW_COMMIT: ${{ needs.release-control.outputs.workflow_commit }}
        run: python tests/consumers/test_delivery_contract.py --mode platform --distribution published --directory build/release-download --manifest build/expected/expected-release-manifest.json --consumer-result build/delivery-evidence/consumer-result.json --platform windows-x86_64 --output build/delivery-evidence/platform.json
        if: runner.os == 'Windows'
      - name: Upload anonymous published consumer producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence-published-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: |
            build/delivery-evidence/consumer-result.json
            build/delivery-evidence/platform.json
            build/expected/expected-release-manifest.json
            build/release-download/release-manifest.json
          if-no-files-found: warn
          retention-days: 7

  release-policy:
    if: always()
    needs: [release-control, build-release, stage-release, verify-downloaded-release, publish-release, verify-published-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the intended release path and all consumer results
        shell: bash
        env:
          CONTROL_RESULT: ${{ needs.release-control.result }}
          BUILD_RESULT: ${{ needs.build-release.result }}
          STAGE_RESULT: ${{ needs.stage-release.result }}
          VERIFY_RESULT: ${{ needs.verify-downloaded-release.result }}
          PUBLISH_RESULT: ${{ needs.publish-release.result }}
          PUBLISHED_VERIFY_RESULT: ${{ needs.verify-published-release.result }}
          SHOULD_BUILD: ${{ needs.release-control.outputs.should_build }}
          REUSING_BUILDS: ${{ needs.release-control.outputs.reuse_builds }}
          PUBLISH_EXPECTED: ${{ github.event_name == 'push' || inputs.publish }}
          SOURCE_COMMIT: ${{ needs.release-control.outputs.commit }}
          WORKFLOW_COMMIT: ${{ needs.release-control.outputs.workflow_commit }}
        run: |
          python3 - <<'PY_POLICY'
          import json, os, sys
          results = {name: os.environ.get(name + "_RESULT", "") for name in ("CONTROL", "BUILD", "STAGE", "VERIFY", "PUBLISH", "PUBLISHED_VERIFY")}
          should_build = os.environ.get("SHOULD_BUILD", "")
          reuse = os.environ.get("REUSING_BUILDS", "")
          publish = os.environ.get("PUBLISH_EXPECTED", "")
          source_commit = os.environ.get("SOURCE_COMMIT", "")
          workflow_commit = os.environ.get("WORKFLOW_COMMIT", "")
          issues = []
          if results["CONTROL"] != "success" or should_build not in {"true", "false"}:
              issues.append("release-control-not-successful")
          if should_build == "true":
              expected_build = "skipped" if reuse == "true" else "success"
              if reuse not in {"true", "false"} or results["BUILD"] != expected_build:
                  issues.append("build-origin-not-qualified")
              if results["STAGE"] != "success" or results["VERIFY"] != "success":
                  issues.append("staging-or-consumers-not-successful")
              if publish not in {"true", "false"} or results["PUBLISH"] != ("success" if publish == "true" else "skipped"):
                  issues.append("publication-result-unexpected")
              if publish == "true" and (not source_commit or source_commit != workflow_commit):
                  issues.append("publication-source-is-not-current-workflow-commit")
              if results["PUBLISHED_VERIFY"] != ("success" if publish == "true" else "skipped"):
                  issues.append("published-anonymous-consumers-result-unexpected")
          elif should_build == "false" and any(results[name] != "skipped" for name in ("BUILD", "STAGE", "VERIFY", "PUBLISH", "PUBLISHED_VERIFY")):
              issues.append("no-release-path-mutated")
          print("RELEASE_POLICY " + json.dumps({"outcome": "fail" if issues else "pass", "issues": issues, "results": results, "should_build": should_build, "reuse_builds": reuse, "source_commit": os.environ.get("SOURCE_COMMIT", "") if should_build == "true" else None, "workflow_commit": os.environ.get("GITHUB_SHA", ""), "run_id": os.environ.get("GITHUB_RUN_ID", "")}, sort_keys=True, separators=(",", ":")))
          sys.exit(1 if issues else 0)
          PY_POLICY
